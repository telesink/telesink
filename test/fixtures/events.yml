new_signup:
  event_type: user.signup
  sink: telebugs
  text: A new user has signed up.
  occurred_at: <%= 2.hours.ago %>
  properties:
    user_email: newuser@example.com

premium_signup:
  event_type: user.signup
  sink: telebugs
  text: A new premium user has signed up successfully with plan upgrade
  occurred_at: <%= 1.hour.ago %>

regular_signup:
  event_type: user.signup
  sink: telebugs
  text: Regular user signed up via email
  occurred_at: <%= 90.minutes.ago %>

payment_success:
  event_type: payment.succeeded
  sink: telebugs
  text: Payment processed for premium monthly plan
  occurred_at: <%= 45.minutes.ago %>

checkout_error:
  event_type: error.occurred
  sink: telebugs
  text: Error during checkout process for premium user
  occurred_at: <%= 30.minutes.ago %>

login_event:
  event_type: user.logged_in
  sink: telebugs
  text: User logged in from mobile device
  occurred_at: <%= 15.minutes.ago %>
